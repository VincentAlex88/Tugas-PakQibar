<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas Bendera</title>
  <link rel="stylesheet" href="flag.css">
</head>
<body>
  <div class="wadah-bendera">
    <div class="bendera georgia">
      <div class="garis-utama vertikal"></div>
      <div class="garis-utama horizontal"></div>
      <div class="salib-kecil kiri-atas"></div>
      <div class="salib-kecil kanan-atas"></div>
      <div class="salib-kecil kiri-bawah"></div>
      <div class="salib-kecil kanan-bawah"></div>
    </div>
    
    <div class="bendera prancis">
      <div class="warna biru"></div>
      <div class="warna putih"></div>
      <div class="warna merah"></div>
    </div>

    <div class="bendera indonesia">
      <div class="lapisan merah"></div>
      <div class="lapisan putih"></div>
    </div>
  </div>
</body>
</html>
